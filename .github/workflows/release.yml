name: Release actions

on:
  push:
    tags:
    - 'v*'

jobs:

  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v2
    - name: Archive Release
      uses: thedoctor0/zip-release@0.7.0
      with:
        type: 'zip'
        directory: 'custom_components/jellyfish_lighting'
        filename: 'hass-jellyfish-lighting.zip'
    - uses: ncipollo/release-action@v1.12.0
      with:
        artifacts: 'custom_components/jellyfish_lighting/hass-jellyfish-lighting.zip'
        draft: true
        generateReleaseNotes: true
        makeLatest: true
        # If a release for this tag already exists (e.g. created by hand), attach
        # the zip to it instead of creating a second draft (see #45). Leave its
        # published state, title and notes alone.
        allowUpdates: true
        omitDraftDuringUpdate: true
        omitNameDuringUpdate: true
        omitBodyDuringUpdate: true
